<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="50%" stop-color="#24283b" />
      <stop offset="100%" stop-color="#1f2335" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="220" rx="14" fill="url(#bg)" />

  <!-- Animated Waves -->
  <path fill="url(#wave1)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M0,165 C250,210 450,120 700,165 C850,190 950,150 1000,165 L1000,220 L0,220 Z;
        M0,165 C250,120 500,210 750,155 C880,135 950,185 1000,165 L1000,220 L0,220 Z;
        M0,165 C250,210 450,120 700,165 C850,190 950,150 1000,165 L1000,220 L0,220 Z" />
  </path>
  <path fill="url(#wave2)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="
        M0,180 C300,135 550,215 800,170 C900,150 960,190 1000,175 L1000,220 L0,220 Z;
        M0,180 C250,215 550,135 800,185 C910,200 960,155 1000,175 L1000,220 L0,220 Z;
        M0,180 C300,135 550,215 800,170 C900,150 960,190 1000,175 L1000,220 L0,220 Z" />
  </path>

  <!-- Name & Subtitle -->
  <text x="500" y="95" text-anchor="middle" fill="url(#accent)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="1">
    Harshil Pabbisetti
  </text>
  <text x="500" y="138" text-anchor="middle" fill="#c0caf5" font-family="'JetBrains Mono', 'Fira Code', monospace, sans-serif" font-size="18" font-weight="500" opacity="0.9">
    Software &amp; Game Developer • BITS Pilani
  </text>
</svg>
