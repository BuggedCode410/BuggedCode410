<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="230">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="496" height="226" rx="12" fill="url(#bg)" stroke="#2f3549" stroke-width="1.5" />
  <rect x="2" y="2" width="496" height="4" rx="2" fill="url(#accent)" />

  <!-- Header -->
  <text x="24" y="38" fill="#7aa2f7" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="700">
    Dungeon Crawler Stealth Game
  </text>
  <rect x="382" y="19" width="94" height="24" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
  <text x="429" y="35" text-anchor="middle" fill="#bb9af7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
    STEALTH AI
  </text>

  <!-- Divider -->
  <line x1="24" y1="54" x2="476" y2="54" stroke="#24283b" stroke-width="1" />

  <!-- Highlights -->
  <g font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" fill="#a9b1d6">
    <circle cx="30" cy="78" r="3" fill="#7aa2f7" />
    <text x="42" y="82"><tspan fill="#c0caf5" font-weight="600">Procedural Maps:</tspan> Binary Space Partitioning (BSP) dungeon</text>
    <text x="42" y="100">generation with randomized rooms and obstacle colliders.</text>

    <circle cx="30" cy="122" r="3" fill="#bb9af7" />
    <text x="42" y="126"><tspan fill="#c0caf5" font-weight="600">Pathfinding FSM:</tspan> Roam, Inspect, and Chase enemy states</text>
    <text x="42" y="144">driven by A* navigation, 2D shadow raycasting, and sound cones.</text>
  </g>

  <!-- Tech Stack Pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#7dcfff">
    <rect x="24" y="182" width="68" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="58" y="199" text-anchor="middle">Python</text>

    <rect x="100" y="182" width="70" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="135" y="199" text-anchor="middle">Pygame</text>

    <rect x="178" y="182" width="90" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="223" y="199" text-anchor="middle">BSP Trees</text>

    <rect x="276" y="182" width="96" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="324" y="199" text-anchor="middle">A* Search</text>

    <rect x="380" y="182" width="96" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="428" y="199" text-anchor="middle">Raycasting</text>
  </g>
</svg>
