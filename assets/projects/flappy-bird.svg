<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="230">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7768e" />
      <stop offset="100%" stop-color="#e0af68" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="496" height="226" rx="12" fill="url(#bg)" stroke="#2f3549" stroke-width="1.5" />
  <rect x="2" y="2" width="496" height="4" rx="2" fill="url(#accent)" />

  <!-- Header -->
  <text x="24" y="38" fill="#f7768e" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="700">
    Flappy Bird: Enhanced Edition
  </text>
  <rect x="382" y="19" width="94" height="24" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
  <text x="429" y="35" text-anchor="middle" fill="#f7768e" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
    ARCADE + DB
  </text>

  <!-- Divider -->
  <line x1="24" y1="54" x2="476" y2="54" stroke="#24283b" stroke-width="1" />

  <!-- Highlights -->
  <g font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" fill="#a9b1d6">
    <circle cx="30" cy="78" r="3" fill="#f7768e" />
    <text x="42" y="82"><tspan fill="#c0caf5" font-weight="600">Gameplay Mechanics:</tspan> Custom asset rendering, pixel-accurate</text>
    <text x="42" y="100">collision detection, collectible power-ups, and difficulty scaling.</text>

    <circle cx="30" cy="122" r="3" fill="#e0af68" />
    <text x="42" y="126"><tspan fill="#c0caf5" font-weight="600">Account Persistence:</tspan> Integrated MySQL authentication and</text>
    <text x="42" y="144">high-score tracking across registered player accounts.</text>
  </g>

  <!-- Tech Stack Pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#7dcfff">
    <rect x="24" y="182" width="68" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="58" y="199" text-anchor="middle">Python</text>

    <rect x="100" y="182" width="70" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="135" y="199" text-anchor="middle">Pygame</text>

    <rect x="178" y="182" width="68" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="212" y="199" text-anchor="middle">MySQL</text>

    <rect x="254" y="182" width="110" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="309" y="199" text-anchor="middle">Game Physics</text>
  </g>
</svg>
