<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="230">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0af68" />
      <stop offset="100%" stop-color="#f7768e" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="496" height="226" rx="12" fill="url(#bg)" stroke="#2f3549" stroke-width="1.5" />
  <rect x="2" y="2" width="496" height="4" rx="2" fill="url(#accent)" />

  <!-- Header -->
  <text x="24" y="38" fill="#e0af68" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="700">
    ACE Club NMTE2A Website
  </text>
  <rect x="386" y="19" width="90" height="24" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
  <text x="431" y="35" text-anchor="middle" fill="#e0af68" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
    BPHC ACM
  </text>

  <!-- Divider -->
  <line x1="24" y1="54" x2="476" y2="54" stroke="#24283b" stroke-width="1" />

  <!-- Highlights -->
  <g font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" fill="#a9b1d6">
    <circle cx="30" cy="78" r="3" fill="#e0af68" />
    <text x="42" y="82"><tspan fill="#c0caf5" font-weight="600">Modular Frontend:</tspan> Built the official event website frontend</text>
    <text x="42" y="100">for the ACE club with reusable React components and fast Vite builds.</text>

    <circle cx="30" cy="122" r="3" fill="#f7768e" />
    <text x="42" y="126"><tspan fill="#c0caf5" font-weight="600">Responsive UI:</tspan> Designed accessible layouts optimized for</text>
    <text x="42" y="144">seamless viewing across both mobile and desktop viewports.</text>
  </g>

  <!-- Tech Stack Pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#7dcfff">
    <rect x="24" y="182" width="66" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="57" y="199" text-anchor="middle">React</text>

    <rect x="98" y="182" width="58" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="127" y="199" text-anchor="middle">Vite</text>

    <rect x="164" y="182" width="90" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="209" y="199" text-anchor="middle">JavaScript</text>

    <rect x="262" y="182" width="110" height="26" rx="6" fill="#1f2335" stroke="#2f3549" />
    <text x="317" y="199" text-anchor="middle">Responsive CSS</text>
  </g>
</svg>
