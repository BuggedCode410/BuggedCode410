<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24">
  <g shape-rendering="crispEdges">
    <!-- Left & Right Pixel Lines -->
    <rect x="0" y="11" width="420" height="2" fill="#292e42" />
    <rect x="580" y="11" width="420" height="2" fill="#292e42" />

    <!-- Left Dither Pixels -->
    <rect x="424" y="10" width="4" height="4" fill="#3b4261" />
    <rect x="434" y="10" width="4" height="4" fill="#565f89" />
    <rect x="444" y="10" width="4" height="4" fill="#7aa2f7" />

    <!-- Right Dither Pixels -->
    <rect x="552" y="10" width="4" height="4" fill="#7aa2f7" />
    <rect x="562" y="10" width="4" height="4" fill="#565f89" />
    <rect x="572" y="10" width="4" height="4" fill="#3b4261" />

    <!-- Left Pixel Gem -->
    <g fill="#bb9af7">
      <rect x="468" y="6" width="4" height="12" />
      <rect x="464" y="10" width="12" height="4" />
    </g>

    <!-- Center Pixel Diamond (Animated Discrete Pulse) -->
    <g>
      <animate attributeName="opacity" values="1;0.45;1" dur="1.4s" calcMode="discrete" repeatCount="indefinite" />
      <rect x="498" y="4" width="4" height="16" fill="#9ece6a" />
      <rect x="494" y="8" width="12" height="8" fill="#9ece6a" />
      <rect x="490" y="10" width="20" height="4" fill="#9ece6a" />
      <rect x="498" y="10" width="4" height="4" fill="#16161e" />
    </g>

    <!-- Right Pixel Gem -->
    <g fill="#f7768e">
      <rect x="528" y="6" width="4" height="12" />
      <rect x="524" y="10" width="12" height="4" />
    </g>
  </g>
</svg>
