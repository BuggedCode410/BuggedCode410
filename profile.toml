# =============================================================================
#  PROFILE CONTENT: every word on the GitHub profile lives in this file.
# =============================================================================
#
#  How to edit:
#    1. Change any text below (on github.com: click the pencil icon).
#    2. Commit to main. A GitHub Action redraws the pixel SVGs and README.md.
#       Locally you can run:  python3 scripts/generate_pixel_svgs.py
#
#  Don't edit README.md or the SVGs in assets/ directly; they get overwritten.
#
#  Colors are names, not hex codes. Use one of:
#    cyan  blue  purple  green  pink  yellow  text  muted
#  The palette (original / ember / sunset) decides what each name looks like.
#
#  Space is limited. Text that's too long for its box shrinks to fit, and the
#  generator prints a warning when it has to shrink a lot. Shorter is better.
# =============================================================================

