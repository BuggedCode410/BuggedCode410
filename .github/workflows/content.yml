name: Rebuild Profile

# Redraws the pixel SVGs and README.md whenever profile.toml (or the
# generator) changes on main.
on:
  push:
    branches:
      - main
    paths:
      - profile.toml
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate SVGs and README from profile.toml
        run: python3 scripts/generate_pixel_svgs.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          if git diff --cached --quiet; then
            echo "Profile is already up to date."
          else
            git commit -m "chore: rebuild profile from profile.toml"
            git pull --rebase
            git push
          fi
